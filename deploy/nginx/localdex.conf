server {
    listen 127.0.0.1:8094;
    server_name localdex.midolog.cc;
    root /Users/kimjinseong/Sites/localdex;
    autoindex off;

    location = / {
        try_files /index.html =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location = /LocalDex-0.1.0.apk {
        types { application/vnd.android.package-archive apk; }
        try_files /LocalDex-0.1.0.apk =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Disposition 'attachment; filename="LocalDex-0.1.0.apk"' always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location / {
        return 404;
    }
}
